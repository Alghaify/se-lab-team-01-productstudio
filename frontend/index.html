<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProductStudio</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><strong>ProductStudio</strong><span>محرر صور المنتجات</span><button>تصدير</button></header><section class="workspace"><aside class="toolbar"><label class="upload">رفع صورة<input id="upload" type="file" accept="image/png,image/jpeg,image/webp"></label><button>قص</button><button>تحسين</button><button>فلاتر</button><button>رسم</button><button>طبقات</button></aside><div class="canvas-wrap"><div id="empty">ارفع صورة للبدء</div><img id="preview" alt="معاينة الصورة"></div><aside class="properties"><h3>الخصائص</h3><label>السطوع<input type="range" min="0" max="2" step="0.1" value="1"></label><label>التباين<input type="range" min="0" max="2" step="0.1" value="1"></label><h3>الطبقات</h3><div class="layer">الصورة الأساسية</div></aside></section></main><script src="app.js"></script></body></html>
